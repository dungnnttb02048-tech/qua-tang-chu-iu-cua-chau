<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cháu tỏ tình chú ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: white;
    }

    /* ===== Sao ===== */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* Sao băng – bay nhanh hơn */
    .shooting-star {
      position: absolute;
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, #fff, transparent);
      border-radius: 50%;
      animation: shoot 2.2s linear infinite;
      opacity: 0;
      z-index: 2;
    }

    @keyframes shoot {
      0% { transform: translateX(0) translateY(0); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateX(350px) translateY(180px); opacity: 0; }
    }

    /* Mặt trăng vàng + hiệu ứng */
    .moon {
      position: fixed;
      top: 7%;
      right: 10%;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 35% 35%, #fff9c4, #ffeb3b 40%, #f9a825 75%, #f57f17);
      border-radius: 50%;
      box-shadow: 
        0 0 30px rgba(255, 235, 59, 0.7),
        0 0 60px rgba(255, 193, 7, 0.45),
        0 0 90px rgba(255, 152, 0, 0.25),
        inset -8px -6px 20px rgba(0, 0, 0, 0.15);
      z-index: 2;
      animation: moonGlow 4s ease-in-out infinite;
    }

    .moon::before {
      content: '';
      position: absolute;
      top: 18%;
      left: 22%;
      width: 18px;
      height: 18px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      filter: blur(1px);
    }

    .moon::after {
      content: '';
      position: absolute;
      top: 38%;
      left: 55%;
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      filter: blur(0.8px);
    }

    @keyframes moonGlow {
      0%, 100% {
        box-shadow: 
          0 0 30px rgba(255, 235, 59, 0.7),
          0 0 60px rgba(255, 193, 7, 0.45),
          0 0 90px rgba(255, 152, 0, 0.25),
          inset -8px -6px 20px rgba(0, 0, 0, 0.15);
        transform: scale(1);
      }
      50% {
        box-shadow: 
          0 0 45px rgba(255, 235, 59, 0.9),
          0 0 80px rgba(255, 193, 7, 0.6),
          0 0 120px rgba(255, 152, 0, 0.35),
          inset -8px -6px 20px rgba(0, 0, 0, 0.15);
        transform: scale(1.06);
      }
    }

    /* ===== Hoa hướng dương ===== */
    .flowers {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .flower {
      position: absolute;
      bottom: 0;
      transform-origin: bottom center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flower__leafs {
      position: relative;
      width: 100px;
      height: 100px;
      animation: sway 7s ease-in-out infinite;
      margin-bottom: -8px;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }

    .flower__leaf {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 55px;
      background: linear-gradient(to top, #f9a825 0%, #ffeb3b 55%, #fff59d 100%);
      border-radius: 50% 50% 18% 18%;
      transform-origin: 50% 100%;
      box-shadow: 0 0 14px rgba(255, 235, 59, 0.55);
    }

    .flower__leaf--inner {
      width: 20px;
      height: 40px;
      background: linear-gradient(to top, #ffb300, #ffee58);
    }

    .flower__center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      background: radial-gradient(circle at 30% 28%, #8d6e63, #4e342e 70%, #3e2723);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 
        inset 0 0 10px rgba(0,0,0,0.45),
        0 0 10px rgba(0,0,0,0.3);
      z-index: 3;
    }

    .flower__center::before {
      content: '';
      position: absolute;
      inset: 5px;
      background: 
        radial-gradient(circle, #5d4037 18%, transparent 19%),
        radial-gradient(circle, #5d4037 18%, transparent 19%);
      background-size: 7px 7px;
      background-position: 0 0, 3.5px 3.5px;
      border-radius: 50%;
      opacity: 0.85;
    }

    .flower__center::after {
      content: '';
      position: absolute;
      inset: -3px;
      border: 2px solid rgba(255, 235, 59, 0.3);
      border-radius: 50%;
    }

    .flower__glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255,235,59,0.28) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: -1;
      animation: glow 3.5s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { opacity: 0.45; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.75; transform: translate(-50%, -50%) scale(1.12); }
    }

    .flower__stem {
      width: 7px;
      height: 180px;
      background: linear-gradient(to bottom, #66bb6a, #2e7d32);
      border-radius: 4px;
      position: relative;
      box-shadow: 1px 0 5px rgba(0,0,0,0.25);
    }

    .flower__stem-leaf {
      position: absolute;
      width: 28px;
      height: 14px;
      background: linear-gradient(135deg, #81c784, #43a047);
      border-radius: 50% 0 50% 50%;
    }

    .flower__stem-leaf--1 { top: 35px; left: -24px; transform: rotate(-42deg); }
    .flower__stem-leaf--2 { top: 70px; right: -24px; transform: rotate(42deg) scaleX(-1); }
    .flower__stem-leaf--3 { top: 110px; left: -20px; transform: rotate(-32deg); }
    .flower__stem-leaf--4 { top: 145px; right: -20px; transform: rotate(32deg) scaleX(-1); }

    .grass {
      position: absolute;
      bottom: 0;
      width: 6px;
      background: linear-gradient(to top, #1b5e20, #66bb6a);
      border-radius: 3px 3px 0 0;
      transform-origin: bottom;
    }

    /* ===== Hộp quà (to hơn + cao lên) ===== */
    .gift-box {
      position: fixed;
      top: 32%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: 155px;
      height: 155px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: floatGift 3s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }

    .gift-box:hover,
    .gift-box:active {
      transform: translateX(-50%) scale(1.12) translateY(-8px);
    }

    @keyframes floatGift {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-14px); }
    }

    .gift-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 90px;
      background: linear-gradient(135deg, #e91e63, #c2185b);
      border-radius: 10px;
      box-shadow: 
        0 14px 36px rgba(233, 30, 99, 0.5),
        inset 0 -6px 12px rgba(0,0,0,0.15);
    }

    .gift-lid {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 132px;
      height: 34px;
      background: linear-gradient(135deg, #f06292, #e91e63);
      border-radius: 7px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.22);
    }

    .gift-ribbon-v {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 100px;
      background: linear-gradient(to bottom, #ffeb3b, #fbc02d);
      border-radius: 3px;
      z-index: 2;
    }

    .gift-ribbon-h {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 18px;
      background: linear-gradient(to right, #ffeb3b, #fbc02d);
      border-radius: 3px;
      z-index: 2;
    }

    .gift-bow {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 32px;
      z-index: 3;
    }

    .gift-bow::before,
    .gift-bow::after {
      content: '';
      position: absolute;
      width: 26px;
      height: 26px;
      background: #ffeb3b;
      border-radius: 50% 50% 0 50%;
      top: 0;
    }

    .gift-bow::before {
      left: 0;
      transform: rotate(-45deg);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    }

    .gift-bow::after {
      right: 0;
      transform: rotate(45deg) scaleX(-1);
      box-shadow: -2px 2px 6px rgba(0,0,0,0.2);
    }

    .gift-bow-center {
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      background: #f9a825;
      border-radius: 50%;
      z-index: 4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    /* ===== Hộp tin nhắn ===== */
    .message-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(255, 255, 255, 0.97);
      color: #333;
      padding: 34px 38px;
      border-radius: 24px;
      text-align: center;
      max-width: 92%;
      width: 400px;
      z-index: 40;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
    }

    .message-box.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .message-box h2 {
      font-family: 'Pacifico', cursive;
      font-size: 28px;
      color: #e91e63;
      margin-bottom: 14px;
    }

    .message-box p {
      font-size: 16.5px;
      line-height: 1.7;
      margin-bottom: 22px;
      color: #444;
    }

    .close-btn {
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 50px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    .close-btn:hover,
    .close-btn:active {
      transform: scale(1.06);
      box-shadow: 0 6px 18px rgba(233, 30, 99, 0.4);
    }

    /* Nyan Cat – to hơn */
    .nyan {
      position: fixed;
      width: 140px;
      top: 14%;
      left: -160px;
      z-index: 15;
      animation: fly 14s linear infinite;
      pointer-events: none;
    }

    @keyframes fly {
      0% { left: -160px; top: 12%; }
      40% { top: 20%; }
      70% { top: 11%; }
      100% { left: 110%; top: 16%; }
    }

    /* Countdown */
    .countdown {
      position: fixed;
      bottom: max(26px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      opacity: 0.8;
      z-index: 10;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      white-space: nowrap;
      padding: 0 12px;
    }

    audio { display: none; }

    /* Tối ưu iPhone / mobile */
    @media (max-width: 700px) {
      .flower {
        transform: scale(0.85) !important;
      }
      .gift-box { width: 130px; height: 130px; top: 30%; }
      .gift-body { width: 100px; height: 75px; }
      .gift-lid { width: 112px; height: 30px; }
      .gift-ribbon-v { width: 18px; height: 88px; }
      .gift-ribbon-h { width: 100px; height: 16px; top: 48px; }
      .gift-bow { width: 44px; height: 28px; }
      .message-box { width: 92%; padding: 26px 22px; }
      .message-box h2 { font-size: 24px; }
      .message-box p { font-size: 15px; }
      .moon { width: 72px; height: 72px; top: 6%; right: 8%; }
      .nyan { width: 110px; }
      .countdown { font-size: 13px; }
    }

    @media (max-width: 400px) {
      .flower {
        transform: scale(0.7) !important;
      }
      .gift-box { width: 115px; height: 115px; top: 28%; }
      .moon { width: 62px; height: 62px; }
      .nyan { width: 95px; }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <div class="shooting-star" style="top:12%; left:15%; animation-delay:0s;"></div>
  <div class="shooting-star" style="top:22%; left:55%; animation-delay:0.9s;"></div>
  <div class="shooting-star" style="top:8%;  left:35%; animation-delay:1.7s;"></div>
  <div class="shooting-star" style="top:30%; left:75%; animation-delay:0.5s;"></div>
  <div class="shooting-star" style="top:18%; left:85%; animation-delay:1.3s;"></div>
  <div class="shooting-star" style="top:5%;  left:45%; animation-delay:2.0s;"></div>
  <div class="shooting-star" style="top:28%; left:25%; animation-delay:1.1s;"></div>

  <img src="https://i.pinimg.com/originals/ed/35/f8/ed35f861be81be2548e514085fb19385.gif" class="nyan" alt="Nyan Cat">

  <div class="flowers" id="flowers"></div>

  <div class="gift-box" id="giftBox" onclick="openGift()">
    <div class="gift-lid"></div>
    <div class="gift-ribbon-v"></div>
    <div class="gift-ribbon-h"></div>
    <div class="gift-bow">
      <div class="gift-bow-center"></div>
    </div>
    <div class="gift-body"></div>
  </div>

  <div class="message-box" id="messageBox">
    <h2>Cháu muốn nói với chú… 💕</h2>
    <p id="messageText"></p>
    <button class="close-btn" onclick="closeGift()">Đóng lại</button>
  </div>

  <div class="countdown" id="countdown"></div>

  <audio id="bgMusic" loop>
    <source src="https://calm-coral-zkzipboe.edgeone.dev/" type="audio/mpeg">
  </audio>

  <script>
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      const size = Math.random() * 2.3 + 1;
      star.style.width = star.style.height = size + 'px';
      starsContainer.appendChild(star);
    }

    const flowersContainer = document.getElementById('flowers');
    const flowerData = [
      { left: '2%',  scale: 1.05 },
      { left: '12%', scale: 1.25 },
      { left: '23%', scale: 1.45 },
      { left: '34%', scale: 1.2 },
      { left: '45%', scale: 1.55 },
      { left: '56%', scale: 1.3 },
      { left: '67%', scale: 1.4 },
      { left: '78%', scale: 1.15 },
      { left: '88%', scale: 1.35 },
      { left: '95%', scale: 1.1 }
    ];

    flowerData.forEach((pos, index) => {
      const flower = document.createElement('div');
      flower.className = 'flower';
      flower.style.left = pos.left;
      flower.style.bottom = '0';
      flower.style.transform = `scale(${pos.scale})`;
      flower.style.animationDelay = (index * 0.4) + 's';

      let leavesHTML = '';
      for (let i = 0; i < 16; i++) {
        leavesHTML += `<div class="flower__leaf" style="transform: translate(-50%, -100%) rotate(${i * 22.5}deg);"></div>`;
      }
      for (let i = 0; i < 12; i++) {
        leavesHTML += `<div class="flower__leaf flower__leaf--inner" style="transform: translate(-50%, -100%) rotate(${i * 30 + 15}deg);"></div>`;
      }

      flower.innerHTML = `
        <div class="flower__leafs">
          <div class="flower__glow"></div>
          ${leavesHTML}
          <div class="flower__center"></div>
        </div>
        <div class="flower__stem">
          <div class="flower__stem-leaf flower__stem-leaf--1"></div>
          <div class="flower__stem-leaf flower__stem-leaf--2"></div>
          <div class="flower__stem-leaf flower__stem-leaf--3"></div>
          <div class="flower__stem-leaf flower__stem-leaf--4"></div>
        </div>
      `;
      flowersContainer.appendChild(flower);
    });

    for (let i = 0; i < 70; i++) {
      const g = document.createElement('div');
      g.className = 'grass';
      g.style.left = Math.random() * 100 + '%';
      g.style.height = (50 + Math.random() * 60) + 'px';
      g.style.transform = `rotate(${(Math.random() - 0.5) * 16}deg)`;
      flowersContainer.appendChild(g);
    }

    const messages = [
      "Cháu thích chú từ lâu rồi… Cháu muốn được ở bên chú mãi mãi 🌻",
      "Cháu yêu chú nhiều lắm. Cháu muốn trở thành người đặc biệt nhất của chú.",
      "Mỗi lần nghĩ đến chú, trái tim cháu lại đập thật nhanh. Cháu yêu chú!",
      "Cháu không biết nói thế nào cho đủ… Chỉ muốn nói: Cháu yêu chú rất nhiều ❤️",
      "Cháu muốn được nắm tay chú, được nhìn chú cười mỗi ngày. Cháu yêu chú.",
      "Cháu đã thích chú từ rất lâu. Hôm nay cháu muốn nói thật lòng: Cháu yêu chú!"
    ];

    let isOpen = false;

    function openGift() {
      if (isOpen) return;
      isOpen = true;
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      document.getElementById('messageText').innerHTML = randomMsg;
      document.getElementById('messageBox').classList.add('show');
      const music = document.getElementById('bgMusic');
      music.volume = 0.5;
      music.play().catch(() => {});
    }

    function closeGift() {
      document.getElementById('messageBox').classList.remove('show');
      isOpen = false;
    }

    function updateCountdown() {
      const now = new Date();
      const startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6);
      const days = Math.floor((now - startDate) / (1000 * 60 * 60 * 24));
      document.getElementById('countdown').textContent = `Cháu và chú đã bên nhau ${days} ngày ❤️`;
    }
    updateCountdown();
    setInterval(updateCountdown, 60000);
  </script>
</body>
</html>
